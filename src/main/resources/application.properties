spring.application.name=inventory-service

# ==========================================
# SERVER
# ==========================================

server.port=8085


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/wms_inventory
spring.datasource.username=postgres
spring.datasource.password=Priya@02
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# LOGGING
# ==========================================

logging.level.com.company.wms.inventory=INFO
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO


# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# KAFKA CONSUMER
# ==========================================

spring.kafka.consumer.group-id=inventory-service-outbox-test
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer


# ==========================================
# DELEGATE DESERIALIZERS
# ==========================================

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer


# ==========================================
# JSON DESERIALIZATION
# ==========================================

spring.kafka.consumer.properties.spring.json.trusted.packages=com.company.wms.inventory.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.company.wms.inventory.event.PutAwayCompletedEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false


# ==========================================
# KAFKA PRODUCER
# ==========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
logging.level.org.springframework.kafka.listener=TRACE
logging.level.org.springframework.kafka.support.serializer=TRACE

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Keycloak JWT configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/wms